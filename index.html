<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- This line is what makes the page behave correctly on phones instead of
       shrinking down like a tiny desktop page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mejor Tarjeta</title>
  <style>
    /* Reset a couple of browser defaults so sizing is predictable */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      background-color: #f7f7fb;
      color: #1a1a2e;
      /* Centers our single content box on the page */
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    main {
      width: 100%;
      max-width: 480px; /* keeps lines readable on wide screens, full-width on phones */
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #4a4a5a;
    }

    button {
      margin-top: 20px;
      font-size: 1.05rem;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background-color: #2d6cdf;
      color: white;
      /* Big enough to tap comfortably with a thumb */
      min-height: 48px;
      width: 100%;
      cursor: pointer;
    }

    button:active {
      background-color: #2558b8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mi Mejor Tarjeta</h1>
    <p>Responde unas preguntas rápidas y te ayudamos a encontrar la tarjeta de crédito que mejor se ajusta a ti.</p>
    <button type="button">Empezar</button>
  </main>
</body>
</html>
