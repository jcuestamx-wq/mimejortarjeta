<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mejor Tarjeta</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      background-color: #f7f7fb;
      color: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #4a4a5a;
    }

    button {
      margin-top: 20px;
      font-size: 1.05rem;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background-color: #2d6cdf;
      color: white;
      min-height: 48px;
      width: 100%;
      cursor: pointer;
    }

    button:active {
      background-color: #2558b8;
    }

    section {
      display: none;
    }

    section.activa {
      display: block;
    }

    .progreso {
      font-size: 0.85rem;
      color: #8a8a9a;
      margin-bottom: 12px;
      text-align: left;
    }

    h2 {
      font-size: 1.3rem;
      text-align: left;
      margin-bottom: 20px;
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opciones button {
      margin-top: 0;
      background-color: #ffffff;
      color: #1a1a2e;
      border: 2px solid #e2e2ea;
      text-align: left;
      font-size: 1rem;
      font-weight: 500;
    }
